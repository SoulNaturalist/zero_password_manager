# ── git-cliff configuration ───────────────────────────────────────────────────
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# NOTE: raw line breaks are preserved — do NOT use trailing `\` continuations
# here. The previous config glued words together ("file.Versions follow").
header = """
# Changelog

All notable changes to **Zero Password Manager** are documented in this file.
Versions follow [Semantic Versioning](https://semver.org/) and this file is
generated automatically by [git-cliff](https://github.com/orhun/git-cliff) on
every push to `main` — do not edit it by hand.
"""

body = """

---

{% if version -%}
## 🏷️ {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## 🔮 Unreleased
{% endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking | length > 0 %}

> ⚠️ **BREAKING CHANGES** — this release contains backwards-incompatible changes.
{% for commit in breaking -%}
> - {{ commit.message | split(pat="\n") | first | trim | truncate(length=140, end="…") | upper_first }}
{% endfor -%}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group }}

{% for commit in commits -%}
- {% if commit.scope -%}**`{{ commit.scope }}`** — {% endif -%}
{{ commit.message | split(pat="\n") | first | trim | truncate(length=140, end="…") | upper_first }}{% if commit.breaking %} ⚠️{% endif %}
{% endfor -%}
{% endfor %}
"""

footer = """

---
<sub>Generated by [git-cliff](https://github.com/orhun/git-cliff) 🦀 — Keep a Changelog format.</sub>
"""

trim = true

# ── Git settings ──────────────────────────────────────────────────────────────

[git]
conventional_commits = true
filter_unconventional = true  # ignore non-conventional commits to keep the log clean
split_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
protect_breaking_commits = false
filter_commits = true
# Skip merge commits and bot-generated "[skip ci]" maintenance commits — both
# were the main source of duplicate lines in the previous CHANGELOG.
ignore_tags = ""
topo_order = false

commit_preprocessors = [
  # Strip gitmoji codes like :art:, :boat:, :lock: so they don't litter the log.
  { pattern = '\s*:[a-z0-9_+-]+:\s*', replace = " " },
  # Collapse whitespace created by the strip above.
  { pattern = '\s{2,}',               replace = " " },
]

commit_parsers = [
  # Drop noise before anything else.
  { message = "^Merge ",                       skip = true                    },
  { message = "\\[skip ci\\]",                 skip = true                    },
  { message = "^chore\\(changelog\\)",         skip = true                    },
  { message = "^chore: update CHANGELOG",      skip = true                    },
  { message = "^chore\\(release\\)",           group = "🔖 Releases"          },
  { message = "^chore",                        skip = true                    },
  { message = "^ci",                           skip = true                    },

  # Breaking changes always show, regardless of type.
  { breaking = true,                           group = "💥 Breaking Changes"  },

  # Conventional commit types.
  { message = "^feat",                         group = "🚀 Features"          },
  { message = "^fix",                          group = "🐛 Bug Fixes"         },
  { message = "^security|^sec",                group = "🔒 Security"          },
  { message = "^perf",                         group = "⚡ Performance"        },
  { message = "^refactor",                     group = "♻️ Refactoring"       },
  { message = "^docs",                         group = "📖 Documentation"     },
  { message = "^test",                         group = "🧪 Tests"             },
  { message = "^style",                        group = "🎨 Style & UX"        },
  { message = "^build",                        group = "📦 Build"             },
  { message = "^revert",                       group = "⏪ Reverts"           },

  # Body-level security annotation catches retroactive fixes.
  { body = ".*security",                       group = "🔒 Security"          },

  # Anything else — drop it rather than leaking raw subjects.
  { message = ".*",                            skip = true                    },
]
